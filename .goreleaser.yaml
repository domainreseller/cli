# GoReleaser v2 configuration. Run by .github/workflows/release.yml on tags (v*).
version: 2
project_name: dna

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: dna
    main: ./cmd/dna
    binary: dna
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  - id: dna
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Keep in sync with scripts/install.sh and scripts/install.ps1.
    name_template: "dna_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README-*.md
      - LICENSE
      - CHANGELOG.md

nfpms:
  - id: dna
    ids: [dna]
    package_name: dna
    # No version in the name, so releases/latest/download/<name> always works.
    # Keep in sync with the README install section.
    file_name_template: "dna_{{ .Os }}_{{ .Arch }}"
    vendor: Domain Name API
    homepage: https://github.com/domainreseller/cli
    maintainer: Domain Name API
    description: Domain Name API command line client and MCP server.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/dna/LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: domainreseller
    name: cli
